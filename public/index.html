
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050505">

    <title>TikTok Downloader</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">TIKTOK<span>DL.</span></div>
        <div class="nav-label">VIDEO DOWNLOADER</div>
    </header>

    <main class="container">

        <section class="hero">

            <div class="tag">SIMPLE VIDEO DOWNLOADER</div>

            <h1>
                Download Your<br>
                <span>Favorite Video.</span>
            </h1>

            <p>
                Download video TikTok dengan mudah.
                Cukup tempelkan link video di bawah ini.
            </p>

            <form id="downloadForm" class="search-box">

                <input
                    type="url"
                    id="videoUrl"
                    placeholder="Paste TikTok video link..."
                    required
                >

                <button type="submit" id="downloadBtn">
                    DOWNLOAD
                </button>

            </form>

            <div class="supported">
                SUPPORTED PLATFORM: TIKTOK
            </div>

        </section>

        <section class="result-section">

            <div class="section-header">
                <h2>DOWNLOAD RESULT</h2>
                <span id="status">WAITING</span>
            </div>

            <div id="resultBox" class="result-box">

                <div class="empty">
                    <h3>NO VIDEO FOUND</h3>
                    <p>Paste a TikTok link to get started.</p>
                </div>

            </div>

        </section>

    </main>

    <footer>
        <span>v hann © 2026</span>
        <span>TikTok Downloader</span>
    </footer>

    <script src="script.js"></script>

</body>
</html>
